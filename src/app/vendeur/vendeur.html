<div class="form-container">
  <h2>Inscription</h2>

  <form [formGroup]="sellerBoutiqueForm" (ngSubmit)="onSubmit()">

    <div class="form-group">
      <label>Nom</label>
      <input formControlName="nom" type="text" />
      <small *ngIf="nom?.touched && nom?.invalid">Nom requis</small>
    </div>

    <div class="form-group">
      <label>Prénom</label>
      <input formControlName="prenom" type="text" />
      <small *ngIf="prenom?.touched && prenom?.invalid">Prénom requis</small>
    </div>

    <div class="form-group">
      <label>Téléphone</label>
      <input formControlName="tel" type="text" />
      <small *ngIf="tel?.touched && tel?.invalid">Numéro valide requis</small>
    </div>

    <div class="form-group">
      <label>Email</label>
      <input formControlName="email" type="email" />
    </div>

    <div class="form-group">
      <label>Adresse</label>
      <input formControlName="adresse" type="text" />
    </div>

    <h3>Boutique</h3>

    <div class="form-group">
      <label>Nom de la boutique</label>
      <input formControlName="libelle" type="text" />
      <small *ngIf="libelle?.touched && libelle?.invalid">Nom de boutique requis</small>
    </div>

    <div class="form-group">
      <label>Date de création</label>
      <input formControlName="date_creation" type="date" />
    </div>

    <button type="submit">Créer</button>
  </form>

  <p class="success" *ngIf="successMessage">{{ successMessage }}</p>
  <p class="error" *ngIf="errorMessage">{{ errorMessage }}</p>
</div>
